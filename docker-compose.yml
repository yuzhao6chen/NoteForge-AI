services:
  backend:
    build: ./backend
    container_name: noteforge_ai_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/noteforge.db:/app/noteforge.db
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: noteforge_ai_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
